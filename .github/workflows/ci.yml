name: Run tests and publish report

on:
  push:
    branches:
      - main # or any branch you want to trigger the deployment from

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'  # Specify your Node.js version here

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run WebdriverIO tests
      - name: Run WebdriverIO tests
        run: npm run test # Replace with your actual test command if different

      # Upload test results or reports to GitHub Pages
      - name: Upload test results and report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./path/to/your/reports # Replace with the directory where your reports are located
          publish_branch: gh-pages # The branch to deploy to GitHub Pages
